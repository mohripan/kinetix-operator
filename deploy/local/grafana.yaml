apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: kinetix
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.kinetix.svc.cluster.local:9090
        isDefault: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: kinetix
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: Kinetix
        orgId: 1
        folder: Kinetix
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-kinetix-dashboard
  namespace: kinetix
data:
  kinetix-phase-1.json: |
    {
      "title": "Kinetix Phase 1",
      "schemaVersion": 39,
      "panels": [
        {
          "type": "timeseries",
          "title": "Input Records",
          "gridPos": {"x": 0, "y": 0, "w": 12, "h": 8},
          "targets": [{"expr": "sum by (component) (rate(kinetix_input_records_total[1m]))"}]
        },
        {
          "type": "timeseries",
          "title": "Output Records",
          "gridPos": {"x": 12, "y": 0, "w": 12, "h": 8},
          "targets": [{"expr": "sum by (component) (rate(kinetix_output_records_total[1m]))"}]
        },
        {
          "type": "timeseries",
          "title": "Processing Errors",
          "gridPos": {"x": 0, "y": 8, "w": 12, "h": 8},
          "targets": [{"expr": "sum by (component, category) (rate(kinetix_processing_errors_total[1m]))"}]
        },
        {
          "type": "timeseries",
          "title": "Latency p95",
          "gridPos": {"x": 12, "y": 8, "w": 12, "h": 8},
          "targets": [{"expr": "histogram_quantile(0.95, sum by (le, component) (rate(kinetix_processing_latency_seconds_bucket[1m])))"}]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: kinetix
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: kinetix
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/part-of: kinetix
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.4.0
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin
          ports:
            - name: http
              containerPort: 3000
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboard
              mountPath: /var/lib/grafana/dashboards
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboard
          configMap:
            name: grafana-kinetix-dashboard
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: kinetix
spec:
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
      nodePort: 30001
  type: NodePort
