apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: kinetix-kafka
  namespace: kinetix
  labels:
    app.kubernetes.io/name: kinetix-kafka
    app.kubernetes.io/part-of: kinetix
spec:
  kafka:
    version: 3.9.0
    replicas: 1
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
      auto.create.topics.enable: "false"
    storage:
      type: ephemeral
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi
  zookeeper:
    replicas: 1
    storage:
      type: ephemeral
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
  entityOperator:
    topicOperator: {}
    userOperator: {}
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: kinetix-input
  namespace: kinetix
  labels:
    strimzi.io/cluster: kinetix-kafka
    app.kubernetes.io/part-of: kinetix
spec:
  partitions: 3
  replicas: 1
  config:
    retention.ms: 3600000
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: kinetix-output
  namespace: kinetix
  labels:
    strimzi.io/cluster: kinetix-kafka
    app.kubernetes.io/part-of: kinetix
spec:
  partitions: 3
  replicas: 1
  config:
    retention.ms: 3600000
