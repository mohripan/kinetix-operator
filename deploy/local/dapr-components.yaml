apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: kinetix-state
  namespace: kinetix
spec:
  type: state.redis
  version: v1
  metadata:
    - name: redisHost
      value: redis.kinetix.svc.cluster.local:6379
    - name: redisPassword
      value: ""
scopes:
  - kinetix-producer
  - kinetix-worker
  - kinetix-sink
