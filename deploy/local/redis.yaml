apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: kinetix
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: kinetix
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: kinetix
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: kinetix
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: kinetix
spec:
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
