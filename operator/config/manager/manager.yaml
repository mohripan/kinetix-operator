apiVersion: apps/v1
kind: Deployment
metadata:
  name: kinetix-operator
  namespace: kinetix
  labels:
    app.kubernetes.io/name: kinetix-operator
    app.kubernetes.io/part-of: kinetix
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kinetix-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kinetix-operator
        app.kubernetes.io/part-of: kinetix
    spec:
      serviceAccountName: kinetix-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: kinetix/operator:dev
          imagePullPolicy: IfNotPresent
          args:
            - --leader-elect
            - --broker-bootstrap=kinetix-kafka-kafka-bootstrap.kinetix.svc.cluster.local:9092
            - --strimzi-cluster=kinetix-kafka
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
