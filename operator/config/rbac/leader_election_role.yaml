apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kinetix-operator-leader-election
  namespace: kinetix
rules:
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
