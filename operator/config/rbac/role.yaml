apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kinetix-operator
  namespace: kinetix
rules:
  - apiGroups:
      - pipeline.kinetix.io
    resources:
      - pipelines
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - pipeline.kinetix.io
    resources:
      - pipelines/status
    verbs:
      - get
      - update
      - patch
  - apiGroups:
      - pipeline.kinetix.io
    resources:
      - pipelines/finalizers
    verbs:
      - update
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - kafka.strimzi.io
    resources:
      - kafkatopics
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
