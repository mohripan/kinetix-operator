apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kinetix-pipeline-editor
  namespace: kinetix
rules:
  - apiGroups:
      - pipeline.kinetix.io
    resources:
      - pipelines
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
