apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kinetix-worker
  namespace: kinetix
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kinetix-worker
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kinetix
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kinetix
      ports:
        - protocol: TCP
          port: 9092
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 3500
        - protocol: TCP
          port: 8080
