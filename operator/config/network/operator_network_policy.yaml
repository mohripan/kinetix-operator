apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kinetix-operator
  namespace: kinetix
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kinetix-operator
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kinetix
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8081
