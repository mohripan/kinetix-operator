apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: pipelines.pipeline.kinetix.io
spec:
  group: pipeline.kinetix.io
  names:
    kind: Pipeline
    listKind: PipelineList
    plural: pipelines
    singular: pipeline
    shortNames:
      - pipe
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: Worker
          type: string
          jsonPath: .status.workerDeployment
        - name: Source
          type: string
          jsonPath: .spec.source.topic
        - name: Sink
          type: string
          jsonPath: .spec.sink.topic
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - source
                - transforms
                - sink
              properties:
                source:
                  type: object
                  required:
                    - kind
                    - topic
                  properties:
                    kind:
                      type: string
                      enum:
                        - KafkaSource
                    topic:
                      type: string
                      minLength: 1
                    schema:
                      type: string
                transforms:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required:
                      - name
                      - image
                    properties:
                      name:
                        type: string
                        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                      image:
                        type: string
                        minLength: 1
                      replicas:
                        type: integer
                        format: int32
                        minimum: 1
                      resources:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                sink:
                  type: object
                  required:
                    - kind
                    - topic
                  properties:
                    kind:
                      type: string
                      enum:
                        - KafkaSink
                    topic:
                      type: string
                      minLength: 1
                    schema:
                      type: string
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                workerDeployment:
                  type: string
                configMap:
                  type: string
                sourceTopic:
                  type: string
                sinkTopic:
                  type: string
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
                  items:
                    type: object
                    required:
                      - type
                      - status
                      - lastTransitionTime
                      - reason
                      - message
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
