apiVersion: pipeline.kinetix.io/v1alpha1
kind: Pipeline
metadata:
  name: example
  namespace: kinetix
spec:
  source:
    kind: KafkaSource
    topic: kinetix-input
    schema: user-event-v1
  transforms:
    - name: normalize
      image: kinetix/demo:dev
      replicas: 1
  sink:
    kind: KafkaSink
    topic: kinetix-output
